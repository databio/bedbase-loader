name: Export metadata to S3

# Dumps the full BEDbase metadata corpus (plus bedsets and membership) to dated,
# immutable Parquet artifacts and publishes them to s3://bedbase/snapshot/.
# The build + publish is done by the `bedboss snapshot` command (bedboss builds
# the Parquet/manifest; bbconf uploads to S3 and records the bed_snapshots index).
#
# Runs monthly (1st, 00:00 UTC) and publishes; also dispatchable manually
# (publish defaults to false for a dry run).
#
# Retention policy: keep monthly snapshots for the trailing 12 months, then thin
# to quarterly (Jan/Apr/Jul/Oct 1) permanently. Nothing is eligible for pruning
# until month 13, so the prune step is a later addition.

on:
  schedule:
  - cron: '0 0 1 * *' # midnight on the 1st of each month
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to S3 and record the snapshot index. Leave false for a dry run.'
        required: true
        default: false
        type: boolean
      fail_threshold:
        description: 'Abort without publishing if this fraction of rows is missing'
        required: true
        default: '0.01'
        type: string

jobs:
  export_metadata:
    runs-on: ubuntu-latest
    # The metadata export alone takes 8-18 min; 30 cancelled the Oct 2026 run.
    # Well under the 360-minute hard cap, so a hang still fails in a useful
    # amount of time.
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: .github/workflows/export_metadata.yml

    - name: Install dependencies
      # `bedboss snapshot new` pulls in bbconf, pyarrow, sqlalchemy, boto3, etc.
      # transitively, so bedboss is the only direct dep. 0.12.1 fixes the
      # bedsets export under SQLAlchemy 2.1.
      # uv + CPU torch: bbconf pulls in geniml[ml]; the default CUDA torch wheels
      # made pip take 10-12 min.
      run: uv pip install --system --torch-backend cpu 'bedboss>=0.12.1'

    - name: Disk before
      run: df -h "$RUNNER_TEMP" /

    - name: Export metadata
      run: |
        ARGS=(--bedbase-config config.yaml --outfolder "$RUNNER_TEMP/exports" --fail-threshold "$FAIL_THRESHOLD")
        if [ "$PUBLISH" = "true" ]; then
          ARGS+=(--publish)
        else
          ARGS+=(--no-publish)
        fi
        bedboss snapshot new "${ARGS[@]}"
      env:
        # On a scheduled run the inputs context is empty, so PUBLISH needs a
        # fallback or the job would silently skip publishing. FAIL_THRESHOLD too.
        PUBLISH: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
        FAIL_THRESHOLD: ${{ inputs.fail_threshold || '0.01' }}
        POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Disk after
      if: always()
      run: df -h "$RUNNER_TEMP" /

    - name: Notify Codon
      # Runs monthly, so report every outcome. A missing message means the job never ran.
      if: always()
      uses: databio/actions/codon-notify@master
      with:
        api-key: ${{ secrets.CODON_API_KEY }}
        url: ${{ secrets.CODON_NOTIFY_URL }}
        status: ${{ job.status }}
        message: BEDbase metadata snapshot
        details: "${{ github.event_name }} run, publish=${{ github.event_name == 'schedule' && 'true' || inputs.publish }}"
