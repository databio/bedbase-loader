name: Fix database schema (one-off)

# Finishes bbconf migration 845d978eac7d on production. See fix_db_schema.py.
# Delete this workflow once it has been applied.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Drop bed.pephub. Leave false for a report only.'
        required: true
        default: false
        type: boolean

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system --torch-backend cpu bbconf

      - name: Fix schema
        run: python fix_db_schema.py config.yaml ${{ inputs.apply && '--apply' || '' }}
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
